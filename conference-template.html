<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Mời Họp Kinh Doanh</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .invitation-card {
            width: 100%;
            max-width: 700px;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            position: relative;
        }

        .top-band {
            height: 140px;
            background: linear-gradient(135deg, #ef7d51, #2b54c4);
            position: relative;
            z-index: 0;
        }

        .curve {
            position: absolute;
            right: -40px;
            top: -60px;
            width: 420px;
            height: 280px;
            background: #2b54c4;
            border-bottom-left-radius: 240px;
            transform: rotate(-12deg);
            z-index: 0;
        }

        .inner-curve {
            position: absolute;
            right: 0;
            top: 20px;
            width: 380px;
            height: 240px;
            background: #f4d59a;
            border-bottom-left-radius: 220px;
            transform: rotate(-12deg);
            opacity: .9;
            z-index: 0;
        }

        .content {
            padding: 24px 32px 40px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .brand {
            font-weight: 600;
            color: #2b54c4;
            margin-top: 0;
            font-size: 14px;
        }

        .title {
            font-size: 44px;
            font-weight: 800;
            color: #224;
            letter-spacing: 1px;
            margin: 8px 0;
        }

        .subtitle {
            font-size: 20px;
            font-weight: 600;
            color: #334;
            margin-bottom: 8px;
        }

        .desc {
            color: #666;
            line-height: 1.7;
            max-width: 520px;
            margin: 0 auto 20px;
        }

        .note {
            margin: 14px auto 6px;
            max-width: 540px;
            color: #6b7280;
            font-style: italic;
        }

        .date-block {
            display: inline-block;
            background: #2b54c4;
            color: #fff;
            border-radius: 12px;
            padding: 16px 22px;
            margin: 10px 0 6px;
            font-weight: 700;
        }

        .meta {
            color: #eab308;
            font-weight: 600;
            font-size: 12px;
            margin-top: -6px;
        }

        .info {
            margin-top: 18px;
            color: #333;
            font-size: 14px;
        }

        .info .item {
            margin: 6px 0;
        }

        .footer {
            padding: 16px 0 4px;
            color: #2b54c4;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="invitation-card">
        <div class="top-band">
            <div class="curve"></div>
            <div class="inner-curve"></div>
        </div>
        <div class="content">
            <div class="brand">Bussiness Letter</div>
            <div class="title">{title}</div>
            <div class="subtitle">{subtitle}</div>

            <p class="desc">{note}</p>

            <div class="date-block">{date}</div>
            <div class="meta">Bắt đầu lúc {time}</div>
            <div class="info">
                <div class="item">Xác nhận tham dự: {rsvpName} - {rsvpPhone}</div>
                <div class="item">{venue}</div>
            </div>
            <div class="footer">Rất mong được gặp bạn!</div>
        </div>
    </div>
</body>

</html>
